version: '3.8'

services:
  api:
    build: .
    container_name: revenue-prediction-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./cs-train:/app/cs-train:ro
      - ./cs-production:/app/cs-production:ro
    restart: unless-stopped
    networks:
      - revenue-network

networks:
  revenue-network:
    driver: bridge
